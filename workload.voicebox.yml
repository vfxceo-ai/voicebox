description: Voicebox web UI and FastAPI backend for voice cloning and agent speech
cuda: ""
sharedMemory: 4

containers:
  - containerImage: vfxceo-ai/voicebox:latest
    repo: ghcr.io
    port: 17493
    maxConnection: 20
    containerCommand: ""
    isCredential: true
    containerEnvs:
      - HOST: "0.0.0.0"
      - PORT: "17493"
      - VOICEBOX_DATA_DIR: "/data/voicebox"
      - VOICEBOX_MODELS_DIR: "/models"
    userStorages:
      - "98": "/data"

gpuSpecs:
  - gpuCode: "028"
